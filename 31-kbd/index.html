<main class="card">
  <div class="title-wrap">
    <h1 class="title">Shortcuts</h1>

  <div class="list" id="list"><div class="sc" data-i="0"><span class="nm">Command menu</span><span class="keys"><kbd data-k="⌘">⌘</kbd><kbd data-k="K">K</kbd></span></div><div class="sc" data-i="1"><span class="nm">Search files</span><span class="keys"><kbd data-k="⌘">⌘</kbd><kbd data-k="P">P</kbd></span></div><div class="sc" data-i="2"><span class="nm">New project</span><span class="keys"><kbd data-k="⇧">⇧</kbd><kbd data-k="⌘">⌘</kbd><kbd data-k="N">N</kbd></span></div><div class="sc" data-i="3"><span class="nm">Go back</span><span class="keys"><kbd data-k="Esc">Esc</kbd></span></div><div class="sc" data-i="4"><span class="nm">Move</span><span class="keys"><kbd data-k="←">←</kbd><kbd data-k="→">→</kbd></span></div></div>
  <p class="hint">On a phone, tap the caps</p>
