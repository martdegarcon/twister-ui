<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog — UI Twists</title>
<meta name="description" content="Dialog that grows out of the button that opened it and folds back into it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>UI Twists · <b>04</b> Dialog</a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Profile</h1>
    <p class="sub">The dialog is born from its button</p>
  </div>
  <div class="profile">
    <span class="ava">MM</span>
    <span class="who"><b id="pName">Marat M.</b><span id="pUser">@marat</span></span>
  </div>
  <button class="btn" id="open" type="button">Edit profile</button>
</main>

<div class="scrim" id="scrim"></div>
<div class="shell" id="shell" aria-hidden="true"><span class="ghost-label">Edit profile</span></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <h2 id="dTitle">Edit profile</h2>
  <p class="dsub">Changes are visible to your team</p>
  <label class="f"><span>Name</span><input id="iName" value="Marat M." autocomplete="off"></label>
  <label class="f"><span>Username</span><input id="iUser" value="@marat" autocomplete="off"></label>
  <div class="actions"><button class="btn ghost" id="cancel" type="button">Cancel</button><button class="btn light" id="save" type="button">Save</button></div>
</div>

<script src="../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
