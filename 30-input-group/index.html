<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Group — UI Twists</title>
<meta name="description" content="URL input: a pasted https:// slides into the prefix, the domain suggests a suffix, and the prefix steps aside for long text.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>UI Twists · <b>30</b> Input Group</a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Website</h1>
    <p class="sub">Paste a full link — “https://” slides into its place</p>
  </div>
  <label class="grp" id="grp">
    <span class="pre" id="pre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><span class="pt">https://</span></span>
    <span class="mid"><span class="mirror" id="mirror"></span><input id="url" autocomplete="off" spellcheck="false" inputmode="url" placeholder="yourname"></span>
    <span class="suf" id="suf"></span>
  </label>
  <div class="links"><a id="paste">Paste “https://marat.design”</a></div>
</main>

<script src="../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
