<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert — UI Twists</title>
<meta name="description" content="Alerts whose weight is their severity; closing folds them into a dot instead of throwing them away.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>UI Twists · <b>47</b> Alert</a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Alerts</h1>
    <p class="sub">Severity is weight. Close folds it into a dot</p>
  </div>
  <div class="seg" id="seg"><button data-k="info" class="on">Info</button><button data-k="warn">Warning</button><button data-k="err">Error</button></div>
  <div class="slot" id="slot">
    <div class="alert" id="alert" role="status">
      <span class="ic" id="ic"></span>
      <div class="tx"><b id="at"></b><p id="ad"></p></div>
      <button class="x" id="x" aria-label="Dismiss">×</button>
    </div>
    <button class="dot" id="dot" aria-label="Show alert"></button>
  </div>
</main>

<script src="../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
