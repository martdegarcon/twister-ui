<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combobox — UI Twists</title>
<meta name="description" content="Combobox where the letters you typed gain weight inside every option, and options re-sort smoothly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>UI Twists · <b>06</b> Combobox</a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Where to?</h1>
    <p class="sub">Your letters get heavy inside every match</p>
  </div>
  <div class="combo" id="combo">
    <label class="field">
      <span class="lbl">City</span>
      <input id="q" autocomplete="off" spellcheck="false" placeholder="Start typing" role="combobox" aria-expanded="true" aria-controls="list">
    </label>
    <ul class="list" id="list" role="listbox"></ul>
  </div>
</main>

<script src="../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
