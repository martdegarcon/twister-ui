<head>
<meta charset="utf-8">

<meta name="description" content="Command palette where the highlight glides between results and results glide to their new rank.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<a class="pack-nav" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>UI Twists · <b>24</b> Command</a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Command</h1>
    <p class="sub">Press ⌘K — or the button. Results and highlight glide</p>
  </div>
  <button class="btn" id="openK" type="button">Open command menu <kbd>⌘K</kbd></button>
</main>
<div class="scrim" id="scrim"></div>
<div class="k" id="k" role="dialog" aria-modal="true" aria-label="Command menu">
  <div class="kin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input id="kq" placeholder="Type a command…" autocomplete="off" spellcheck="false"></div>
  <div class="kl" id="kl"><span class="hl" id="hl"></span></div>
</div>

<script src="../shared/haptics.js"></script>
<script src="script.js"></script>
