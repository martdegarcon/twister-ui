<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet — UI Twists</title>
<meta name="description" content="Side sheet that pushes the page aside instead of covering it; the grid reflows to make room.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>UI Twists · <b>42</b> Sheet</a>

<div class="shell" id="shell">
<main class="card wide">
  <div class="title-wrap">
    <h1 class="title">Library</h1>
    <p class="sub">Open the sheet — it pushes, the grid makes room</p>
  </div>
  <div class="grid" id="grid"><div class="tile" style="--h:220">Atlas</div><div class="tile" style="--h:260">Dealflow</div><div class="tile" style="--h:200">Care</div><div class="tile" style="--h:30">Pickup</div><div class="tile" style="--h:280">Sandbox</div><div class="tile" style="--h:240">Flow</div></div>
  <button class="btn" id="open" type="button">Filters</button>
</main>
<aside class="sheet" id="sheet" aria-label="Filters">
  <h2>Filters</h2>
  <label class="chk">Show archived<input type="checkbox" switch checked></label>
  <label class="chk">Only mine<input type="checkbox" switch></label>
  <label class="chk">Recently edited<input type="checkbox" switch checked></label>
  <button class="btn light" id="close" type="button">Done</button>
</aside>
</div>

<script src="../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
