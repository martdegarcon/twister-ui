<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popover — UI Twists</title>
<meta name="description" content="Popover that grows out of the exact point you clicked and shrinks back into it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">

<body>
<a class="pack-nav" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>UI Twists · <b>36</b> Popover</a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Popover</h1>
    <p class="sub">Click anywhere on a swatch — it grows from that point</p>
  </div>
  <div class="sw" id="sw">
    <button style="--c:#97A6BE"></button><button style="--c:#B097BE"></button><button style="--c:#97BEB5"></button>
    <button style="--c:#BEA997"></button><button style="--c:#FF9B8F"></button><button style="--c:#F4F4F4"></button>
  </div>
</main>
<div class="pop" id="pop" role="dialog" aria-label="Color details">
  <span class="chip" id="chip"></span>
  <div class="info"><b id="hex"></b><span id="name"></span></div>
  <div class="acts"><button>Copy</button><button>Rename</button><button>Remove</button></div>
</div>

<script src="../shared/haptics.js"></script>
<script src="script.js"></script>
