<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination — UI Twists</title>
<meta name="description" content="Pagination where numbers slide to make room and the current page rolls on a drum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>UI Twists · <b>35</b> Pagination</a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Results</h1>
    <p class="sub">Numbers slide aside; the page counter rolls</p>
  </div>
  <div class="big"><span class="drum" id="d1"></span><span class="drum" id="d2"></span><span class="of">/ 24</span></div>
  <nav class="pag" id="pag" aria-label="Pagination">
    <button class="arr" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="nums" id="nums"><span class="pill" id="pill"></span></div>
    <button class="arr" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</main>

<script src="../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
